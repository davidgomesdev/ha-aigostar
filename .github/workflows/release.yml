name: Release

on:
  push:
    branches: [main, beta]

# The built-in GITHUB_TOKEN is used for all git and release operations.
# Commits/tags it creates do NOT retrigger workflows, so no anti-recursion
# guard is needed.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            semantic-release-replace-plugin
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge-back to dev
        if: steps.semantic.outputs.new_release_published == 'true' && github.ref_name == 'main'
        run: |
          VERSION="${{ steps.semantic.outputs.new_release_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git checkout dev
          git merge main --no-edit -m "chore: merge-back v${VERSION} to dev"
          git push origin dev
          echo "Merged main (v${VERSION}) back into dev"
